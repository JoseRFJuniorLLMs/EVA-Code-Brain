<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Brain - Assistente Profissional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(30, 27, 75, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #6366f1;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo h1 {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }

        .stats {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #6366f1;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.75rem;
        }

        .container {
            flex: 1;
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            gap: 1rem;
            padding: 1rem;
            overflow: hidden;
        }

        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(30, 27, 75, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #6366f1, #a855f7);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #10b981, #3b82f6);
        }

        .message-content {
            max-width: 70%;
            background: rgba(51, 65, 85, 0.5);
            padding: 1rem;
            border-radius: 12px;
            line-height: 1.6;
        }

        .message.user .message-content {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .source-files {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
        }

        .source-files-title {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .file-tag {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            margin: 0.25rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .input-area {
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid rgba(99, 102, 241, 0.3);
        }

        .input-container {
            display: flex;
            gap: 1rem;
        }

        input {
            flex: 1;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            padding: 1rem;
            color: #e2e8f0;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        button {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6366f1;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        .side-panel {
            width: 300px;
            background: rgba(30, 27, 75, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 1.5rem;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #a855f7;
        }

        .example-questions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .example-btn {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 0.75rem;
            border-radius: 8px;
            color: #e2e8f0;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .example-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.7);
        }

        code {
            background: rgba(15, 23, 42, 0.8);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #a855f7;
        }

        pre {
            background: rgba(15, 23, 42, 0.8);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
            border-left: 3px solid #6366f1;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">
            <h1>🧠 Code Brain</h1>
        </div>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalFiles">-</div>
                <div class="stat-label">Arquivos</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalChunks">-</div>
                <div class="stat-label">Chunks</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="chat-panel">
            <div class="messages" id="messages">
                <div class="message assistant">
                    <div class="message-avatar">🧠</div>
                    <div class="message-content">
                        Olá! Sou seu assistente de código. Faça perguntas sobre seu projeto e eu vou buscar nas
                        informações indexadas.
                    </div>
                </div>
            </div>
            <div class="input-area">
                <div class="input-container">
                    <input type="text" id="questionInput" placeholder="Ex: Como funciona o sistema de autenticação?"
                        onkeypress="if(event.key==='Enter') askQuestion()">
                    <button onclick="askQuestion()" id="sendBtn">Perguntar</button>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-title">💡 Exemplos</div>
            <div class="example-questions">
                <button class="example-btn" onclick="setQuestion(this.textContent)">
                    Como funciona o WebSocket?
                </button>
                <button class="example-btn" onclick="setQuestion(this.textContent)">
                    Onde está a lógica de autenticação?
                </button>
                <button class="example-btn" onclick="setQuestion(this.textContent)">
                    Como o áudio é processado?
                </button>
                <button class="example-btn" onclick="setQuestion(this.textContent)">
                    Quais são as dependências principais?
                </button>
                <button class="example-btn" onclick="setQuestion(this.textContent)">
                    Explique a estrutura do banco de dados
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';

        // Carrega estatísticas
        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/stats`);
                const data = await res.json();
                document.getElementById('totalFiles').textContent = data.total_files;
                document.getElementById('totalChunks').textContent = data.total_chunks;
            } catch (e) {
                console.error('Erro ao carregar stats:', e);
            }
        }

        function addMessage(role, content, sourceFiles = []) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = role === 'user' ? '👤' : '🧠';

            let html = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    ${content}
            `;

            if (sourceFiles.length > 0) {
                html += `
                    <div class="source-files">
                        <div class="source-files-title">📁 Arquivos consultados:</div>
                        ${sourceFiles.map(f => `<span class="file-tag">${f}</span>`).join('')}
                    </div>
                `;
            }

            html += `</div>`;
            messageDiv.innerHTML = html;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addLoading() {
            const messagesDiv = document.getElementById('messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading-message';
            loadingDiv.innerHTML = `
                <div class="message-avatar">🧠</div>
                <div class="message-content">
                    <div class="loading">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
            `;
            messagesDiv.appendChild(loadingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeLoading() {
            const loading = document.getElementById('loading-message');
            if (loading) loading.remove();
        }

        async function askQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();

            if (!question) return;

            // Adiciona pergunta do usuário
            addMessage('user', question);
            input.value = '';

            // Desabilita botão
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            addLoading();

            try {
                const res = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                const data = await res.json();

                removeLoading();
                addMessage('assistant', data.answer, data.source_files);

            } catch (error) {
                removeLoading();
                addMessage('assistant', `❌ Erro: ${error.message}`);
            } finally {
                btn.disabled = false;
            }
        }

        function setQuestion(text) {
            document.getElementById('questionInput').value = text;
        }

        // Inicializa
        loadStats();
        setInterval(loadStats, 30000); // Atualiza stats a cada 30s
    </script>
</body>

</html>
