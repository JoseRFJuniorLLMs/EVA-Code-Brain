<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA Code Brain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a0a1f 0%, #0f1a2e 100%);
            color: #ffb3d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ffb3d9, #b3d9ff);
            border-radius: 4px;
        }

        /* Header */
        .header {
            background: rgba(26, 10, 31, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 179, 217, 0.3);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .logo h1 {
            background: linear-gradient(135deg, #ffb3d9, #b3d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
            text-shadow: 0 0 20px rgba(255, 179, 217, 0.4);
        }

        /* Layout */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Chat Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
            padding-bottom: 100px;
            /* Space for FAB */
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto 20px auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message.assistant {
            flex-direction: row;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(255, 179, 217, 0.1);
            border: 1px solid rgba(255, 179, 217, 0.3);
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(255, 179, 217, 0.2);
        }

        .message-content {
            background: rgba(255, 179, 217, 0.05);
            border: 1px solid rgba(255, 179, 217, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            line-height: 1.6;
            position: relative;
            font-size: 14px;
        }

        .message.user .message-content {
            background: rgba(179, 217, 255, 0.1);
            border-color: rgba(179, 217, 255, 0.2);
            border-top-right-radius: 2px;
        }

        .message.assistant .message-content {
            border-top-left-radius: 2px;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: rgba(15, 26, 46, 0.95);
            border-top: 1px solid rgba(255, 179, 217, 0.2);
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 10px;
            position: relative;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 179, 217, 0.3);
            color: #ffb3d9;
            padding: 15px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding-right: 60px;
            /* Space for send button */
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #b3d9ff;
            box-shadow: 0 0 15px rgba(179, 217, 255, 0.1);
        }

        .send-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: rgba(255, 179, 217, 0.1);
        }

        /* FAB - Floating Action Button */
        .fab-container {
            position: fixed;
            bottom: 100px;
            right: 30px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .fab {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ffb3d9, #ff6b9d);
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            transition: all 0.3s;
            position: relative;
        }

        .fab:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.6);
        }

        .fab.zen-btn {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            margin-bottom: 20px;
        }

        .fab.zen-btn {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            margin-bottom: 20px;
        }

        .fab.connecting {
            background: #b3b3b3;
            animation: spin 1s infinite linear;
        }

        .fab-status {
            font-size: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .fab-container:hover .fab-status,
        .fab.active+.fab-status {
            opacity: 1;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(255, 77, 77, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 77, 77, 0);
            }
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Model Selector */
        .model-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 0 20px;
        }

        .model-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 179, 217, 0.3);
            color: #ffb3d9;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .model-btn:hover {
            background: rgba(255, 179, 217, 0.1);
        }

        .model-btn.active {
            background: rgba(255, 179, 217, 0.2);
            border-color: #ffb3d9;
            box-shadow: 0 0 10px rgba(255, 179, 217, 0.2);
        }

        .file-tag {
            display: inline-block;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(179, 217, 255, 0.3);
            color: #b3d9ff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">
            <h1>🧠 EVA Code Brain</h1>
        </div>
        <div style="font-size: 0.8rem; opacity: 0.6;">v3.0 Lite</div>
    </div>

    <div class="container">
        <div class="messages" id="messages">
            <div class="message assistant">
                <div class="message-avatar">🧠</div>
                <div class="message-content">
                    Olá! Sou o EVA Code Brain.<br>
                    Estou pronto para analisar seu código ou conversar por voz.<br><br>
                    <ul>
                        <li>📝 <b>Texto:</b> Digite abaixo para buscar no código.</li>
                        <li>🎤 <b>Voz:</b> Clique no botão flutuante para falar.</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="model-selector">
            <button class="model-btn active" onclick="setModel('auto')">Auto</button>
            <button class="model-btn" onclick="setModel('grok')">Grok</button>
            <button class="model-btn" onclick="setModel('ollama')">Ollama</button>
            <button class="model-btn" onclick="setModel('gemini')">Gemini</button>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="questionInput" placeholder="Digite sua pergunta..."
                    onkeypress="if(event.key==='Enter') askQuestion()">
                <button class="send-btn" onclick="askQuestion()">➤</button>
            </div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <div class="fab-container">
        <button id="zenBtn" class="fab zen-btn" onclick="toggleZen()">
            🧘
        </button>
        <div class="fab-status">Modo Zen</div>

        <button id="voiceBtn" class="fab" onclick="toggleVoice()">
            🎤
        </button>
        <div id="voiceStatus" class="fab-status">Toque para Falar</div>
    </div>

    <div id="youtube-player" style="opacity: 0; position: absolute; z-index: -1;"></div>

    // ... (rest of html) ...


    <script>
        // ============================================
        // Configurações
        //Frontend only logic, merging existing logic into new UI
        // ============================================
        const API_URL = '';
        const WS_URL = "wss://eva-mind-sdk-285161077100.europe-southwest1.run.app/ws/pcm";
        const CPF = "64525430249";
        const TARGET_SAMPLE_RATE = 24000;
        const CAPTURE_CHUNK_SIZE = 2400;

        let ws = null;
        let audioContext = null;
        let scriptProcessor = null;
        let mediaStream = null;
        let playbackContext = null;
        let isActive = false;
        let currentModel = 'auto';

        function setModel(model) {
            currentModel = model;
            document.querySelectorAll('.model-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase() === model || (model === 'auto' && btn.textContent === 'Auto')) {
                    btn.classList.add('active');
                }
            });
            console.log("Modelo alterado para:", model);
        }

        // YouTube Player
        let player;
        let isPlayerReady = false;

        // Carrega API do YouTube de forma assíncrona
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Carrega API do YouTube de forma assíncrona
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '1',
                width: '1',
                videoId: 'e3T8ctg1D6I',
                playerVars: {
                    'listType': 'playlist',
                    'list': 'RDe3T8ctg1D6I',
                    'autoplay': 1,
                    'controls': 0,
                    'loop': 1,
                    'mute': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            event.target.mute();
            event.target.pauseVideo();
        }

        // ZEN MODE
        function toggleZen() {
            const btn = document.getElementById('zenBtn');

            if (!isPlayerReady) {
                alert("Player do YouTube ainda carregando...");
                return;
            }

            const playerState = player.getPlayerState();

            // 1 = Playing, 2 = Paused, 5 = Cued, -1 = Unstarted
            if (playerState !== 1) {
                player.playVideo();
                btn.style.opacity = '1';
                btn.style.boxShadow = '0 0 20px #a855f7';
            } else {
                player.pauseVideo();
                btn.style.boxShadow = 'none';
            }
        }

        // ============================================
        // UI Helpers
        // ============================================
        function addMessage(role, content, sourceFiles = []) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = role === 'user' ? '👤' : '🧠'; // Same avatar for Voice (EVA) and Code Brain for now

            let html = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${content}
            `;

            if (sourceFiles && sourceFiles.length > 0) {
                html += `<div style="margin-top:10px; pt-2; border-top:1px solid rgba(255,255,255,0.1)">
                    <div style="font-size:10px; color:#aaa; margin-bottom:5px">ARQUIVOS:</div>
                    ${sourceFiles.map(f => `<span class="file-tag">${f}</span>`).join('')}
                </div>`;
            }
            html += `</div>`;

            messageDiv.innerHTML = html;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============================================
        // Chat Logic
        // ============================================
        async function askQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            addMessage('user', question);
            input.value = '';

            const loadingId = 'loading-' + Date.now();
            const messagesDiv = document.getElementById('messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = loadingId;
            loadingDiv.innerHTML = `<div class="message-avatar">🧠</div><div class="message-content">...</div>`;
            messagesDiv.appendChild(loadingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const res = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, model: currentModel })
                });

                const loader = document.getElementById(loadingId);
                if (loader) loader.remove();

                if (!res.ok) {
                    const errText = await res.text();
                    let errMsg = errText;
                    try {
                        const errJson = JSON.parse(errText);
                        errMsg = errJson.error || errText;
                    } catch (e) { }

                    // Tratamento específico para 429 (Muitas requisições / Cota)
                    if (res.status === 429 || errMsg.includes("429") || errMsg.includes("Too Many Requests")) {
                        throw new Error("⏳ <b>Cota do Grok Excedida!</b><br>Muitas requisições. Tente novamente em alguns minutos ou altere o modelo no .env.");
                    }

                    throw new Error(`Erro (${res.status}): ${errMsg}`);
                }

                const data = await res.json();
                addMessage('assistant', data.answer.replace(/\n/g, '<br>'), data.source_files);
            } catch (e) {
                const loader = document.getElementById(loadingId);
                if (loader) loader.remove();
                addMessage('assistant', `⚠️ ${e.message}`);
            }
        }

        // ============================================
        // Voice Logic (Toggle)
        // ============================================
        function toggleVoice() {
            if (isActive) {
                stopEVA();
            } else {
                startEVA();
            }
        }

        function setVoiceState(state) {
            const btn = document.getElementById('voiceBtn');
            const status = document.getElementById('voiceStatus');

            btn.className = 'fab'; // Reset
            btn.innerHTML = '🎤';

            if (state === 'connecting') {
                btn.classList.add('connecting');
                btn.innerHTML = '⌛';
                status.textContent = 'Conectando...';
            } else if (state === 'active') {
                isActive = true;
                btn.classList.add('active');
                btn.innerHTML = '⏹️';
                status.textContent = 'Gravando (Toque para parar)';
            } else {
                isActive = false;
                status.textContent = 'Toque para Falar';
            }
        }

        async function startEVA() {
            setVoiceState('connecting');

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: TARGET_SAMPLE_RATE,
                        channelCount: 1
                    }
                });

                ws = new WebSocket(WS_URL);
                ws.binaryType = 'arraybuffer';

                ws.onopen = async () => {
                    ws.send(JSON.stringify({ type: 'register', cpf: CPF }));
                    await new Promise(r => setTimeout(r, 500));

                    const sessionId = 'web-' + Date.now();
                    ws.send(JSON.stringify({ type: 'start_call', cpf: CPF, session_id: sessionId }));

                    startAudioCapture();
                    setVoiceState('active');
                };

                ws.onmessage = (event) => {
                    // Audio
                    if (event.data instanceof ArrayBuffer || event.data instanceof Blob) {
                        if (event.data instanceof Blob) {
                            event.data.arrayBuffer().then(playAudio);
                        } else {
                            playAudio(event.data);
                        }
                        return;
                    }

                    // Transcriptions / JSON
                    try {
                        const msg = JSON.parse(event.data);
                        // console.log("WS Msg:", msg);

                        if (msg.type === 'response.audio_transcript.delta' || msg.type === 'transcription') {
                            // Handle streaming transcripts if needed, simplifying for now
                        }

                        // Try to catch text content (Adjust based on actual EVA-Mind protocol)
                        // Assuming some form of 'text' or 'transcript' event exists
                        if (msg.text) {
                            addMessage(msg.role || 'assistant', msg.text);
                        }
                        if (msg.transcript && msg.role === 'user') {
                            addMessage('user', msg.transcript);
                        }

                    } catch (e) { }
                };

                ws.onerror = (e) => {
                    console.error(e);
                    stopEVA();
                    alert("Erro de conexão com voz.");
                };

                ws.onclose = () => {
                    if (isActive) stopEVA();
                };

            } catch (e) {
                alert("Erro ao iniciar voz: " + e.message);
                setVoiceState('idle');
            }
        }

        function stopEVA() {
            setVoiceState('idle');

            if (ws) {
                ws.send(JSON.stringify({ type: 'hangup' }));
                ws.close();
                ws = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        function startAudioCapture() {
            audioContext = new AudioContext({ sampleRate: TARGET_SAMPLE_RATE });
            const source = audioContext.createMediaStreamSource(mediaStream);
            const bufferSize = 4096;
            scriptProcessor = audioContext.createScriptProcessor(bufferSize, 1, 1);

            let pcmBuffer = [];

            scriptProcessor.onaudioprocess = (e) => {
                if (!isActive || ws?.readyState !== WebSocket.OPEN) return;

                const input = e.inputBuffer.getChannelData(0);

                for (let i = 0; i < input.length; i++) {
                    pcmBuffer.push(input[i]);
                    if (pcmBuffer.length >= CAPTURE_CHUNK_SIZE) {
                        const pcm16 = new Int16Array(CAPTURE_CHUNK_SIZE);
                        for (let j = 0; j < CAPTURE_CHUNK_SIZE; j++) {
                            const s = Math.max(-1, Math.min(1, pcmBuffer[j]));
                            pcm16[j] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        ws.send(pcm16.buffer);
                        pcmBuffer = [];
                    }
                }
            };

            source.connect(scriptProcessor);
            scriptProcessor.connect(audioContext.destination);
        }

        async function playAudio(arrayBuffer) {
            if (!playbackContext) {
                playbackContext = new AudioContext({ sampleRate: TARGET_SAMPLE_RATE });
                await playbackContext.resume();
            }
            const pcm16 = new Int16Array(arrayBuffer);
            const float32 = new Float32Array(pcm16.length);
            for (let i = 0; i < pcm16.length; i++) {
                float32[i] = pcm16[i] / 32768.0;
            }
            const buffer = playbackContext.createBuffer(1, float32.length, TARGET_SAMPLE_RATE);
            buffer.getChannelData(0).set(float32);
            const source = playbackContext.createBufferSource();
            source.buffer = buffer;
            source.connect(playbackContext.destination);
            source.start();
        }
    </script>
</body>

</html>
